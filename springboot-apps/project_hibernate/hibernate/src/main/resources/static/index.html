<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Paco's Hardware store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f0f2f5; }
        header { background-color: #1e90ff; padding: 20px; color: white; font-family: Verdana; text-align: center; font-size: 2em; display: flex; align-items: center; justify-content: center; gap: 10px; }
        nav { background-color: #007bff; color: white; display: flex; justify-content: center; gap: 20px; padding: 10px 0; font-size: 16px; font-weight: bold; }
        nav a { color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; }
        nav a:hover { background-color: #0056b3; }
        h3 { text-align: center; font-family: Verdana; color: #333; font-size: 1.8em; margin-top: 20px; }
        #panel { padding: 20px; background: white; margin: 20px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        button { margin: 5px; padding: 10px 15px; border: none; border-radius: 5px; color: white; cursor: pointer; font-size: 14px; }
        .btn-blue { background-color: #007bff; }
        .btn-green { background-color: #28a745; }
        .btn-orange { background-color: #fd7e14; }
        .btn-gray { background-color: #6c757d; }
        button:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #e9ecef; }
        input { padding: 8px; margin: 5px; border: 1px solid #ccc; border-radius: 5px; }
        #tableResults { margin: 20px; }
    </style>
</head>

<body>

<header>
    <i class="fas fa-hammer"></i> Paco's Hardware store
</header>

<nav>
    <a href="#">Articles</a>
    <a href="#">Providers</a>
    <a href="#">Sales</a>
    <a href="#">Users</a>
    <a href="#">Warehouse</a>
    <a href="#">Reports</a>
</nav>

<h3>Control de Inventario</h3>

<div id="panel">
    <button class="btn-blue" onclick="listAllarticles()"><i class="fas fa-box"></i> List Article</button>
    <button class="btn-blue" onclick="findarticleId()"><i class="fas fa-search"></i> Find Article</button>
    <hr>
    <button class="btn-green" onclick="renderFormUpdatearticle()"><i class="fas fa-edit"></i> Update Article</button>
    <button class="btn-gray" onclick="renderFormDeletearticle()"><i class="fas fa-trash"></i> Delete Article</button>
    <button class="btn-orange" onclick="renderFormInsertarticle()"><i class="fas fa-plus"></i> Insert Article</button>
</div>

<div id="forms" style="margin: 20px;"></div>
<div id="tableResults"></div>

<script>
       const BASE_URL = "http://localhost:8080/api/articles";


    // LIST Articles
    function listAllarticles() {
        $.get(BASE_URL, function (data) {
            renderTable(data);
        }).fail(() => Swal.fire("Error", "No Articles found", "error"));
    }

    // FIND BY ID
    function findarticleId() {
        Swal.fire({
            title: "Find article",
            input: "number",
            inputLabel: "Type the ID of the article",
            showCancelButton: true,
            confirmButtonText: "Search"
        }).then(result => {
            if (result.isConfirmed && result.value) {
                $.get(BASE_URL + "/" + result.value, function (data) {
                    renderTable([data]);
                }).fail(() => Swal.fire("Error", "Article not found", "error"));
            }
        });
    }

    // FORM UPDATE
    function renderFormUpdatearticle() {
        $("#forms").html(`
            <h4>Update Article</h4>
            <input type="number" id="inputID" placeholder="Article ID"><br>
            <input type="text" id="inputarticleName" placeholder="New name"><br>
            <input type="number" id="inputPrice" placeholder="New price"><br>
            <input type="number" id="inputQty" placeholder="New quantity"><br>
            <button class="btn-green" onclick="updatearticle()">Update</button>
        `);
    }

    // UPDATE article
    function updatearticle() {
        const id = $("#inputID").val();
        const dto = {
            articleName: $("#inputarticleName").val(),
            price: $("#inputPrice").val(),
            quantity: $("#inputQty").val()
        };
        $.ajax({
            url: BASE_URL + "/" + id,
            method: "PUT",
            contentType: "application/json",
            data: JSON.stringify(dto),
            success: data => {
                Swal.fire("Success", "Article updated OK", "success");
                renderTable([data]);
            },
            error: () => Swal.fire("Error", "Not updated", "error")
        });
    }

    // FORM DELETE
    function renderFormDeletearticle() {
        $("#forms").html(`
            <h4>Delete Article</h4>
            <input type="number" id="delId" placeholder="Article ID"><br>
            <button class="btn-gray" onclick="deletearticle()">Delete</button>
        `);
    }

    // DELETE article
    function deletearticle() {
        const id = $("#delId").val();
        $.ajax({
            url: BASE_URL + "/" + id,
            method: "DELETE",
            success: msg => Swal.fire("Success", msg, "success"),
            error: () => Swal.fire("Error", "Not deleted", "error")
        });
    }

    // FORM INSERT
    function renderFormInsertarticle() {
        $("#forms").html(`
            <h4>Insert new article</h4>
            <input type="text" id="insName" placeholder="Article name"><br>
            <input type="number" id="insPrice" placeholder="price"><br>
            <input type="number" id="insQty" placeholder="quantity"><br>
            <button class="btn-orange" onclick="insertarticle()">Save</button>
        `);
    }

    // INSERT article
    function insertarticle() {
        const dto = {
            articleName: $("#insName").val(),
            price: $("#insPrice").val(),
            quantity: $("#insQty").val()
        };
        $.ajax({
            url: BASE_URL,
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(dto),
            success: data => {
                Swal.fire("Success", "Article registered OK", "success");
                renderTable([data]);
            },
            error: () => Swal.fire("Error", "Not registered", "error")
        });
    }

    // TENDER HTML TABLE
    function renderTable(data) {
        let html = `
            <table border="1" cellpadding="5" cellspacing="0">
                <tr>
                    <th>ID</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Quantity</th>
                </tr>
        `;
        data.forEach(a => {
            html += `
                <tr>
                    <td>${a.id}</td>
                    <td>${a.articleName}</td>
                    <td>${a.price}</td>
                    <td>${a.quantity}</td>
                </tr>
            `;
        });
        html += "</table>";
        $("#tableResults").html(html);
    }

</script>

</body>
</html>
