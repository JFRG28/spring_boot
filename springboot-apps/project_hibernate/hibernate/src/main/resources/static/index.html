<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Paco's Hardware store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f0f2f5; }
        header { background-color: #1e90ff; padding: 20px; color: white; font-family: Verdana; text-align: center; font-size: 2em; display: flex; align-items: center; justify-content: center; gap: 10px; }
        nav { background-color: #007bff; color: white; display: flex; justify-content: center; gap: 20px; padding: 10px 0; font-size: 16px; font-weight: bold; }
        nav a { color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; }
        nav a:hover { background-color: #0056b3; }
        h3 { text-align: center; font-family: Verdana; color: #333; font-size: 1.8em; margin-top: 20px; }
        #panel { padding: 20px; background: white; margin: 20px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        button { margin: 5px; padding: 10px 15px; border: none; border-radius: 5px; color: white; cursor: pointer; font-size: 14px; }
        .btn-blue { background-color: #007bff; }
        .btn-green { background-color: #28a745; }
        .btn-orange { background-color: #fd7e14; }
        .btn-gray { background-color: #6c757d; }
        button:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #e9ecef; }
        input { padding: 8px; margin: 5px; border: 1px solid #ccc; border-radius: 5px; }
        #tableResults { margin: 20px; }
    </style>
</head>

<body>

<header>
    <i class="fas fa-hammer"></i> Paco's Hardware store
</header>

<nav>
    <a href="#">Products</a>
    <a href="#">Providers</a>
    <a href="#">Sales</a>
    <a href="#">Users</a>
    <a href="#">Warehouse</a>
    <a href="#">Reports</a>
</nav>

<h3>Control de Inventario</h3>

<div id="panel">
    <button class="btn-blue" onclick="listAllProducts()"><i class="fas fa-box"></i> List Product</button>
    <button class="btn-blue" onclick="findProductId()"><i class="fas fa-search"></i> Find Product</button>
    <hr>
    <button class="btn-green" onclick="renderFormUpdateProduct()"><i class="fas fa-edit"></i> Update Product</button>
    <button class="btn-gray" onclick="renderFormDeleteProduct()"><i class="fas fa-trash"></i> Delete Product</button>
    <button class="btn-orange" onclick="renderFormInsertProduct()"><i class="fas fa-plus"></i> Insert Product</button>
</div>

<div id="forms" style="margin: 20px;"></div>
<div id="tableResults"></div>

<script>
       const BASE_URL = "http://localhost:8080/api/articles";


    // LIST PRODUCTS
    function listAllProducts() {
        $.get(BASE_URL, function (data) {
            renderTable(data);
        }).fail(() => Swal.fire("Error", "No products found", "error"));
    }

    // FIND BY ID
    function findProductId() {
        Swal.fire({
            title: "Find product",
            input: "number",
            inputLabel: "Type the ID of the product",
            showCancelButton: true,
            confirmButtonText: "Search"
        }).then(result => {
            if (result.isConfirmed && result.value) {
                $.get(BASE_URL + "/" + result.value, function (data) {
                    renderTable([data]);
                }).fail(() => Swal.fire("Error", "Product not found", "error"));
            }
        });
    }

    // FORM UPDATE
    function renderFormUpdateProduct() {
        $("#forms").html(`
            <h4>Update Product</h4>
            <input type="number" id="inputID" placeholder="Product ID"><br>
            <input type="text" id="inputProductName" placeholder="New name"><br>
            <input type="number" id="inputPrice" placeholder="New price"><br>
            <input type="number" id="inputQty" placeholder="New quantity"><br>
            <button class="btn-green" onclick="updateProduct()">Update</button>
        `);
    }

    // UPDATE PRODUCT
    function updateProduct() {
        const id = $("#inputID").val();
        const dto = {
            articleName: $("#inputProductName").val(),
            price: $("#inputPrice").val(),
            quantity: $("#inputQty").val()
        };
        $.ajax({
            url: BASE_URL + "/" + id,
            method: "PUT",
            contentType: "application/json",
            data: JSON.stringify(dto),
            success: data => {
                Swal.fire("Success", "Product updated OK", "success");
                renderTable([data]);
            },
            error: () => Swal.fire("Error", "Not updated", "error")
        });
    }

    // FORM DELETE
    function renderFormDeleteProduct() {
        $("#forms").html(`
            <h4>Delete Product</h4>
            <input type="number" id="delId" placeholder="Product ID"><br>
            <button class="btn-gray" onclick="deleteProduct()">Delete</button>
        `);
    }

    // DELETE PRODUCT
    function deleteProduct() {
        const id = $("#delId").val();
        $.ajax({
            url: BASE_URL + "/" + id,
            method: "DELETE",
            success: msg => Swal.fire("Success", msg, "success"),
            error: () => Swal.fire("Error", "Not deleted", "error")
        });
    }

    // FORM INSERT
    function renderFormInsertProduct() {
        $("#forms").html(`
            <h4>Insert new product</h4>
            <input type="text" id="insName" placeholder="Product name"><br>
            <input type="number" id="insPrice" placeholder="price"><br>
            <input type="number" id="insQty" placeholder="quantity"><br>
            <button class="btn-orange" onclick="insertProduct()">Save</button>
        `);
    }

    // INSERT PRODUCT
    function insertProduct() {
        const dto = {
            articleName: $("#insName").val(),
            price: $("#insPrice").val(),
            quantity: $("#insQty").val()
        };
        $.ajax({
            url: BASE_URL,
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(dto),
            success: data => {
                Swal.fire("Success", "Product registered OK", "success");
                renderTable([data]);
            },
            error: () => Swal.fire("Error", "Not registered", "error")
        });
    }

    // TENDER HTML TABLE
    function renderTable(data) {
        let html = `
            <table border="1" cellpadding="5" cellspacing="0">
                <tr>
                    <th>ID</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Quantity</th>
                </tr>
        `;
        data.forEach(a => {
            html += `
                <tr>
                    <td>${a.id}</td>
                    <td>${a.articleName}</td>
                    <td>${a.price}</td>
                    <td>${a.quantity}</td>
                </tr>
            `;
        });
        html += "</table>";
        $("#tableResults").html(html);
    }

</script>

</body>
</html>
